#version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: gpu-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: gpu_platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: platform123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "platform", "-pplatform123"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped
    networks:
      - platform-network

  # 管理平台后端
  ai4s-platform:
    image: connermo/ai4s-platform:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai4s-platform-backend
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - "${DATA_ROOT:-./data}:/app/data"
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=${PORT:-8080}
      - DB_DSN=${DB_DSN:-platform:platform123@tcp(mysql:3306)/gpu_platform?charset=utf8mb4&parseTime=True&loc=Local}
      - DEFAULT_PORT_PREFIX=${DEFAULT_PORT_PREFIX:-10000}
      - PORT_STEP=${PORT_STEP:-10}
      - DATA_ROOT=/app/data
      - HOST_DATA_ROOT=${DATA_ROOT:-${PWD}/data}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - platform-network

  # 开发环境镜像构建服务
  dev-env-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: connermo/ai4s-env:latest
    container_name: gpu-dev-env-builder
    profiles:
      - build-only
    command: "echo 'Development environment image built successfully'"

networks:
  platform-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local